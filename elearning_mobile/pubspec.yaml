name: elearning_mobile
description: "Aplikasi Mobile E-Learning SMK Muthia Harapan Cicalengka untuk Guru dan Siswa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.66.0
  mobile_scanner: ^5.2.3
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/mhc_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
